[project]
name = "corrective-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "deepak", email = "guptadeepak2310@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "faiss-cpu>=1.15.1",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langgraph>=1.2.15",
    "pypdf>=6.21.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
corrective-rag = "corrective_rag:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
